name: Validate historical S14 packages (no deployment)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Rebuild, inspect archives and exercise failure gates
        shell: pwsh
        run: npm run test:release -- 594ccd9a7de812a49f2c0d8260d20cbfced71752
