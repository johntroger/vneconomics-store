name: Validate historical S14 packages (no deployment)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Rebuild, inspect archives and exercise failure gates
        shell: pwsh
        run: npm run test:release -- 594ccd9a7de812a49f2c0d8260d20cbfced71752
