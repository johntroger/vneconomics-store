name: Validate historical S14 packages (no deployment)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild, inspect archives and exercise failure gates
        shell: pwsh
        run: npm run test:release -- 594ccd9a7de812a49f2c0d8260d20cbfced71752
