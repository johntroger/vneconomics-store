name: Rebuild candidate package and native checks
on:
  push:
    branches: [codex/rebuild-r52-candidate]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build packages from exact source
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: node scripts/run-clean.mjs script scripts/rebuild-release.mjs $env:SOURCE_SHA
      - name: Native installation maintenance and rollback
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: node scripts/run-clean.mjs script scripts/test-rebuild-r52-native.mjs $env:SOURCE_SHA
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rebuild-${{ github.sha }}
          path: |
            artifacts/rebuild/${{ github.sha }}/
            docs/acceptance/R52-rebuild/native-results.json
          if-no-files-found: error
          retention-days: 21
