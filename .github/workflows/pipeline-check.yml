name: Build immutable release candidate (no deployment)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character source commit SHA
        required: true
        type: string
      profile:
        description: Explicit reviewed release profile
        required: true
        type: choice
        options:
          - vne-073-043-stars1-schema3
permissions:
  contents: read
jobs:
  payload:
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_PROFILE: ${{ inputs.profile }}
    steps:
      - name: Validate exact source input
        shell: pwsh
        run: |
          if ($env:SOURCE_SHA -notmatch '^[a-f0-9]{40}$') { throw 'source_sha must be 40 lowercase hex characters' }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        shell: pwsh
        run: npm ci --ignore-scripts
      - name: Verify deterministic candidate
        shell: pwsh
        run: npm run test:candidate -- $env:RELEASE_PROFILE $env:SOURCE_SHA
      - name: Build candidate from the exact reviewed source
        shell: pwsh
        run: npm run build:candidate -- $env:RELEASE_PROFILE $env:SOURCE_SHA
      - name: Preserve candidate for approval
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pipeline-${{ env.SOURCE_SHA }}
          path: artifacts/pipeline/${{ env.SOURCE_SHA }}/
          if-no-files-found: error
          retention-days: 21
