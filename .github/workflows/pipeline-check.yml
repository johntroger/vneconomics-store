name: Build immutable release candidate (no deployment)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character source commit SHA
        required: true
        type: string
      profile:
        description: Explicit reviewed release profile
        required: true
        type: choice
        options:
          - vne-073-043-stars1-schema3
permissions:
  contents: read
jobs:
  payload:
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_PROFILE: ${{ inputs.profile }}
    steps:
      - name: Validate exact source input
        shell: pwsh
        run: |
          if ($env:SOURCE_SHA -notmatch '^[a-f0-9]{40}$') { throw 'source_sha must be 40 lowercase hex characters' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        shell: pwsh
        run: npm ci --ignore-scripts
      - name: Verify deterministic candidate
        shell: pwsh
        run: npm run test:candidate -- $env:RELEASE_PROFILE $env:SOURCE_SHA
      - name: Build candidate from the exact reviewed source
        shell: pwsh
        run: npm run build:candidate -- $env:RELEASE_PROFILE $env:SOURCE_SHA
      - name: Preserve candidate for approval
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pipeline-${{ env.SOURCE_SHA }}
          path: artifacts/pipeline/${{ env.SOURCE_SHA }}/
          if-no-files-found: error
          retention-days: 21
