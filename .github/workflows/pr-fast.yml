name: Fast pull-request checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fast-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        shell: pwsh
        run: npm ci --ignore-scripts
      - name: Check JavaScript syntax
        shell: pwsh
        run: npm run test:ci-fast
      - name: Check workflow security contract
        shell: pwsh
        run: npm run test:workflow-contract
      - name: Check candidate evidence policy
        shell: pwsh
        run: npm run test:pipeline-ci -- --u2
      - name: Check R6 CSS candidate policy
        shell: pwsh
        run: node scripts/run-clean.mjs script scripts/test-r6-css-profile.mjs
