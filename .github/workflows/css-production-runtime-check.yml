name: CSS production runtime fixture checks
on:
  pull_request:
    paths:
      - 'release-tools/r6-css-adapter.php'
      - 'scripts/release-r6-css-adapter.mjs'
      - 'scripts/r6-css-operator.mjs'
      - 'scripts/release-r6-css.mjs'
      - 'scripts/release-lib.mjs'
      - 'scripts/local-runtime.mjs'
      - 'scripts/run-clean.mjs'
      - 'scripts/css-runtime-test-process.mjs'
      - 'scripts/test-css-production-runtime*.mjs'
      - 'scripts/fixtures/s06-theme-seed.php'
      - 'docs/acceptance/S02/source-observations.json'
      - 'package*.json'
      - '.github/workflows/css-production-runtime-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: css-production-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Validate exact source SHA
        run: node -e "const s=process.env.SOURCE_SHA||''; if(s.length!==40||!/^[a-f0-9]+$/.test(s)) throw Error('Exact source SHA required')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - name: Verify checkout source
        run: node -e "const s=require('node:child_process').execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(); if(s!==process.env.SOURCE_SHA) throw Error('Checkout SHA differs'); console.log('SOURCE_SHA='+s)"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check runtime workflow contract
        run: npm run test:css-production-runtime-workflow
      - name: Check full native runtime and process restart
        run: npm run test:css-production-runtime
