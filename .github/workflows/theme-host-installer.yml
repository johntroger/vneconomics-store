name: Theme host installer native review
on:
  pull_request:
    paths:
      - 'scripts/theme-host-installer.php'
      - 'scripts/test-theme-host-installer.mjs'
      - 'scripts/verify-theme-host-installer.mjs'
      - 'scripts/theme-release.mjs'
      - 'scripts/local-runtime.mjs'
      - 'scripts/run-clean.mjs'
      - 'scripts/*release-ci-scope.mjs'
      - 'deploy/theme-release-baseline.json'
      - 'package*.json'
      - '.github/workflows/theme-host-installer.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: theme-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - name: Verify metadata-only closeout or require full checks
        id: scope
        run: node scripts/run-clean.mjs script scripts/release-ci-scope.mjs
      - name: Verify exact source
        if: steps.scope.outputs.metadata_only != 'true'
        shell: pwsh
        run: |
          if ($env:SOURCE_SHA -cnotmatch '^[a-f0-9]{40}$' -or (git rev-parse HEAD) -cne $env:SOURCE_SHA) { throw 'Source differs' }
      - run: npm ci --ignore-scripts
        if: steps.scope.outputs.metadata_only != 'true'
      - name: Native PHP install health rollback and guard tests
        if: steps.scope.outputs.metadata_only != 'true'
        id: test
        run: npm run test:theme-host-installer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.scope.outputs.metadata_only != 'true'
        with:
          name: theme-host-installer-${{ env.SOURCE_SHA }}
          path: ${{ steps.test.outputs.directory }}/
          if-no-files-found: error
          retention-days: 21
